<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Videos · Video Icon Detector</title>
<meta name="description" content="Choose a video to detect icons, emojis and logos with Google Gemini and review them on a timeline.">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1><a href="/">Video Icon Detector</a></h1>
</header>

<div class="library">
  <div class="library-head">
    <h2>Videos</h2>
    <p id="count"></p>
  </div>
  <div id="videos"><div class="empty">Loading videos…</div></div>
</div>

<script>
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

const fmt = s => { s = Math.max(0, Math.round(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = String(s % 60).padStart(2, "0");
  return h ? `${h}:${String(m).padStart(2, "0")}:${x}` : `${m}:${x}`; };
const size = b => b >= 1e9 ? `${(b / 1e9).toFixed(1)} GB` : `${Math.round(b / 1e6)} MB`;
const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;

function card(v) {
  const a = el("a", "video-card");
  a.href = `/watch/${encodeURIComponent(v.name)}`;

  const thumb = el("div", "thumb");
  const img = el("img");
  img.loading = "lazy";
  img.alt = "";
  img.src = `/api/videos/${encodeURIComponent(v.name)}/thumbnail`;
  img.onerror = () => img.remove();
  thumb.append(img);
  if (v.duration_seconds) thumb.append(el("span", "len", fmt(v.duration_seconds)));

  const meta = el("div", "meta");
  const title = el("div", "title", v.name);
  title.title = v.name;
  meta.append(title, el("div", "info", size(v.size_bytes)));
  meta.append(v.last_scan
    ? el("span", "badge", `${plural(v.last_scan.distinct_icons, "icon")} · ${plural(v.scans, "scan")}`)
    : el("span", "badge none", "Not scanned"));

  a.append(thumb, meta);
  return a;
}

async function load() {
  const box = $("videos");
  try {
    const videos = await (await fetch("/api/videos")).json();
    $("count").textContent = videos.length ? plural(videos.length, "video") : "";
    if (!videos.length) {
      const n = el("div", "notice");
      n.append("No videos yet. Copy video files into the ", el("code", null, "videos/"), " folder and refresh this page.");
      box.replaceChildren(n);
      return;
    }
    const grid = el("div", "grid");
    videos.forEach(v => grid.append(card(v)));
    box.replaceChildren(grid);
  } catch {
    box.replaceChildren(el("div", "notice", "Could not load the video list. Is the API running?"));
  }
}

load();
</script>
</body>
</html>
