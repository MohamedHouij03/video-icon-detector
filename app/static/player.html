<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Icon Detector</title>
<meta name="description" content="Play a video and see the icons, emojis and logos detected by Google Gemini, with timestamps.">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <a class="back" href="/">&larr; All videos</a>
  <h1 id="videoName">Video Icon Detector</h1>
</header>

<main>
  <section>
    <div class="stage" id="stage">
      <video id="video" controls preload="metadata"></video>
      <div class="overlay" id="overlay"></div>
    </div>

    <div class="card timeline">
      <div class="tl-head"><span>Timeline: click a row to jump</span><span id="clock">0:00</span></div>
      <div class="lanes" id="lanes"><div class="empty">Run a scan or pick a report to see icons here.</div></div>
    </div>
  </section>

  <aside>
    <div class="card">
      <h2>Scan</h2>
      <div class="row">
        <div>
          <label for="start">Start</label>
          <input id="start" value="0:00">
        </div>
        <div>
          <label for="length">Length</label>
          <select id="length">
            <option value="30">30 s</option>
            <option value="60" selected>1 min</option>
            <option value="120">2 min</option>
            <option value="300">5 min</option>
            <option value="">Rest of video</option>
          </select>
        </div>
        <div>
          <label for="fps">Detail</label>
          <select id="fps">
            <option value="1" selected>1 fps</option>
            <option value="2">2 fps</option>
            <option value="4">4 fps</option>
          </select>
        </div>
      </div>
      <button class="link" id="useCurrent">Start from the current video position</button>
      <div style="margin-top:10px"><button class="primary" id="scanBtn">Scan for icons</button></div>
      <div class="steps" id="steps"><span></span><span></span><span></span><span></span></div>
      <div class="status" id="status"></div>
    </div>

    <div class="card">
      <h2>Report</h2>
      <select id="reportSelect"><option value="">No reports yet</option></select>
      <div id="reportInfo" style="margin-top:10px"></div>
      <div class="btn-row">
        <button class="danger" id="clearBtn" disabled>Clear results</button>
      </div>
    </div>

    <div class="card">
      <h2>All sightings</h2>
      <div class="list" id="sightings"><div class="empty">Nothing yet.</div></div>
    </div>
  </aside>
</main>

<script>
const $ = id => document.getElementById(id);
const video = $("video"), overlay = $("overlay");
const VIDEO_NAME = decodeURIComponent(location.pathname.replace(/^\/watch\//, ""));
const VIDEO_QS = `video=${encodeURIComponent(VIDEO_NAME)}`;

video.src = `/api/videos/${encodeURIComponent(VIDEO_NAME)}/stream`;
$("videoName").textContent = VIDEO_NAME;
document.title = `${VIDEO_NAME} · Video Icon Detector`;
const COLORS = ["#ff5d73", "#5b8cff", "#ffb547", "#3ecf8e", "#c77dff", "#2ec4d6", "#ff8a4c", "#a3d65c", "#f06bd1", "#8fa3bf"];
const STAGES = ["queued", "cutting clip", "uploading", "analyzing"];

let report = null, colorOf = {}, activeKey = "";

// Helpers
const fmt = s => { s = Math.max(0, Math.round(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = String(s % 60).padStart(2, "0");
  return h ? `${h}:${String(m).padStart(2, "0")}:${x}` : `${m}:${x}`; };
const parseTime = str => str.trim().split(":").reduce((acc, p) => acc * 60 + parseFloat(p || 0), 0);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const store = { get: k => { try { return localStorage.getItem(k); } catch { return null; } },
                set: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} } };

// Visible window of a sighting: at least 1 s, since Gemini samples about once per second
const endOf = s => Math.max(s.end_seconds, s.start_seconds + 1);

// "top-left", "upper right corner", "center" ... -> grid cell
function cellFor(pos) {
  pos = (pos || "").toLowerCase();
  const v = /top|upper/.test(pos) ? "t" : /bottom|lower/.test(pos) ? "b" : "m";
  const h = /left/.test(pos) ? "l" : /right/.test(pos) ? "r" : "c";
  return v + h;
}

// Fit the overlay to the visible picture, not the letterboxed element
function placeOverlay() {
  const vw = video.videoWidth, vh = video.videoHeight;
  const W = video.clientWidth, H = video.clientHeight;
  if (!vw || !vh) { Object.assign(overlay.style, { left: 0, top: 0, width: W + "px", height: H + "px" }); return; }
  const scale = Math.min(W / vw, H / vh), w = vw * scale, h = vh * scale;
  Object.assign(overlay.style, { left: (W - w) / 2 + "px", top: (H - h) / 2 + "px", width: w + "px", height: h + "px" });
}
new ResizeObserver(placeOverlay).observe(video);
video.addEventListener("loadedmetadata", () => { placeOverlay(); renderTimeline(); });

// Playback loop
function tick() {
  const t = video.currentTime;
  $("clock").textContent = `${fmt(t)} / ${fmt(video.duration || 0)}`;
  const ph = document.querySelector(".playhead");
  if (ph && video.duration) ph.style.left = `calc((100% - 130px) * ${t / video.duration})`;

  const active = report ? report.sightings.filter(s => t >= s.start_seconds && t < endOf(s)) : [];
  const key = active.map(s => report.sightings.indexOf(s)).join(",");
  if (key !== activeKey) {
    activeKey = key;
    overlay.replaceChildren();
    const cells = {};
    for (const s of active) {
      const c = cellFor(s.position);
      if (!cells[c]) { cells[c] = el("div", `cell ${c[0]} ${c[1]}`); overlay.append(cells[c]); }
      const tag = el("div", "tag", s.icon);
      tag.style.setProperty("--c", colorOf[s.icon.toLowerCase()]);
      tag.append(el("small", null, `${s.category} · ${s.start}–${s.end}`));
      cells[c].append(tag);
    }
    document.querySelectorAll(".item").forEach(it => it.classList.toggle("active", active.includes(report.sightings[it.dataset.i])));
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

// Rendering
function renderTimeline() {
  const lanes = $("lanes");
  if (!report || !report.summary.length) {
    lanes.replaceChildren(el("div", "empty", report ? "No icons were found in the scanned range." : "Run a scan or pick a report to see icons here."));
    return;
  }
  const dur = video.duration || report.duration_seconds;
  const pct = s => `${(s / dur) * 100}%`;
  lanes.replaceChildren();
  for (const e of report.summary) {
    const lane = el("div", "lane");
    const name = el("div", "name", e.icon);
    name.title = `${e.icon} (${e.appearances}×)`;
    const track = el("div", "track");
    const sc = el("div", "scanned");
    sc.style.left = pct(report.range_start); sc.style.width = pct(report.range_end - report.range_start);
    track.append(sc);
    for (const s of report.sightings.filter(s => s.icon.toLowerCase() === e.icon.toLowerCase())) {
      const seg = el("div", "seg");
      seg.style.setProperty("--c", colorOf[e.icon.toLowerCase()]);
      seg.style.left = pct(s.start_seconds); seg.style.width = pct(endOf(s) - s.start_seconds);
      seg.title = `${s.icon} ${s.start}–${s.end}`;
      track.append(seg);
    }
    track.addEventListener("click", ev => {
      const r = track.getBoundingClientRect();
      video.currentTime = ((ev.clientX - r.left) / r.width) * dur;
    });
    lane.append(name, track);
    lanes.append(lane);
  }
  lanes.append(el("div", "playhead"));
}

function renderReport() {
  colorOf = {};
  (report?.summary || []).forEach((e, i) => colorOf[e.icon.toLowerCase()] = COLORS[i % COLORS.length]);
  activeKey = "-";

  const info = $("reportInfo");
  info.replaceChildren();
  const list = $("sightings");
  list.replaceChildren();
  if (!report) { list.append(el("div", "empty", "Nothing yet.")); renderTimeline(); return; }

  const stats = el("div", "stats");
  for (const [n, l] of [[report.distinct_icons, "distinct icons"], [report.total_sightings, "appearances"], [`${fmt(report.range_start)}–${fmt(report.range_end)}`, "scanned"]]) {
    const d = el("div"); d.append(el("b", null, n), el("span", null, l)); stats.append(d);
  }
  const meta = el("div", "d", `${report.model} · ${report.fps} fps · ${report.generated_at.replace("T", " ")}`);
  meta.style.color = "var(--muted)"; meta.style.fontSize = "12px";
  const dl = el("div", "downloads");
  for (const f of ["json", "md"]) { const a = el("a", null, `Download .${f}`); a.href = `/api/reports/${report.job_id}?format=${f}`; dl.append(a); }
  info.append(stats, meta, dl);

  if (!report.sightings.length) list.append(el("div", "empty", "No icons found in this range."));
  report.sightings.forEach((s, i) => {
    const it = el("div", "item"); it.dataset.i = i;
    const dot = el("div", "dot"); dot.style.setProperty("--c", colorOf[s.icon.toLowerCase()]);
    const body = el("div"); body.append(el("div", null, s.icon), el("div", "d", `${s.category} · ${s.position} · ${s.description}`));
    it.append(dot, body, el("div", "t", `${s.start}–${s.end}`));
    it.addEventListener("click", () => { video.currentTime = s.start_seconds; video.play(); });
    list.append(it);
  });
  renderTimeline();
}

// Reports
const REPORT_KEY = `report:${VIDEO_NAME}`, TASK_KEY = `task:${VIDEO_NAME}`;
let scanning = false;

async function loadReportList(selectId) {
  const reports = await (await fetch(`/api/reports?${VIDEO_QS}`)).json();
  const sel = $("reportSelect");
  sel.replaceChildren();
  $("clearBtn").disabled = scanning || !reports.length;
  if (!reports.length) {
    sel.append(el("option", null, "No reports yet"));
    report = null;
    renderReport();
    return;
  }
  for (const r of reports) {
    const o = el("option", null, `${(r.generated_at || "").replace("T", " ")} · ${fmt(r.range_start)}–${fmt(r.range_end)} · ${r.distinct_icons} icons`);
    o.value = r.job_id; sel.append(o);
  }
  sel.value = selectId || store.get(REPORT_KEY) || reports[0].job_id;
  if (!sel.value) sel.value = reports[0].job_id;
  await loadReport(sel.value);
}
async function loadReport(jobId) {
  if (!jobId) return;
  const res = await fetch(`/api/reports/${jobId}`);
  if (!res.ok) return;
  report = await res.json();
  store.set(REPORT_KEY, jobId);
  renderReport();
}
$("reportSelect").addEventListener("change", e => loadReport(e.target.value));

$("clearBtn").addEventListener("click", async () => {
  const count = $("reportSelect").options.length;
  if (!confirm(`Delete ${count === 1 ? "the saved report" : `all ${count} saved reports`} for this video? This cannot be undone.`)) return;
  $("clearBtn").disabled = true;
  try {
    const res = await fetch(`/api/reports?${VIDEO_QS}`, { method: "DELETE" });
    if (!res.ok) throw new Error(res.statusText);
    const { deleted } = await res.json();
    store.set(REPORT_KEY, null);
    await loadReportList();
    $("start").value = "0:00";
    setStatus(`Cleared ${deleted} report${deleted === 1 ? "" : "s"}. Ready for a new scan.`, "ok");
  } catch (e) {
    setStatus(`Could not clear results: ${e.message}`, "err");
    $("clearBtn").disabled = false;
  }
});

// Scanning
function setStatus(text, cls = "") { const s = $("status"); s.textContent = text; s.className = "status " + cls; }
function setStep(stage) {
  const i = STAGES.indexOf(stage);
  [...$("steps").children].forEach((sp, j) => sp.className = i < 0 ? "" : j < i ? "done" : j === i ? "now" : "");
}

$("useCurrent").addEventListener("click", () => { $("start").value = fmt(video.currentTime); });

$("scanBtn").addEventListener("click", async () => {
  const start = parseTime($("start").value);
  if (isNaN(start)) { setStatus("Start must look like 1:30 or 90.", "err"); return; }
  const body = { video: VIDEO_NAME, start, fps: parseFloat($("fps").value) };
  if ($("length").value) body.length = parseFloat($("length").value);

  setScanning(true);
  setStatus("Queuing…"); setStep("queued");
  try {
    const res = await fetch("/api/scans", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail?.[0]?.msg || data.detail || res.statusText);
    store.set(TASK_KEY, data.task_id);
    poll(data.task_id);
  } catch (e) {
    setStatus(`Could not start: ${e.message}`, "err"); setStep(null); setScanning(false);
  }
});

function setScanning(on) {
  scanning = on;
  $("scanBtn").disabled = on;
  $("clearBtn").disabled = on || !report;
}

async function poll(taskId) {
  setScanning(true);
  const began = Date.now();
  while (true) {
    let s;
    try { s = await (await fetch(`/api/tasks/${taskId}`)).json(); }
    catch { setStatus("Lost contact with the API, retrying…", "err"); await new Promise(r => setTimeout(r, 3000)); continue; }

    if (s.status === "SUCCESS") {
      store.set(TASK_KEY, null); setStep(null);
      setStatus(`Done: ${s.result.distinct_icons} icons, ${s.result.total_sightings} appearances.`, "ok");
      setScanning(false);
      await loadReportList(s.result.job_id);
      video.currentTime = s.result.range_start;
      return;
    }
    if (s.status === "FAILURE") {
      store.set(TASK_KEY, null); setStep(null);
      setStatus(`Failed: ${s.error}`, "err"); setScanning(false); return;
    }
    const secs = Math.round((Date.now() - began) / 1000);
    if (s.status === "PROGRESS") { setStep(s.progress.stage); setStatus(`${s.progress.stage[0].toUpperCase() + s.progress.stage.slice(1)}… (${secs}s)`); }
    else if (s.status === "RETRY") setStatus(`Temporary error, retrying soon: ${s.error}`, "err");
    else if (s.status === "STARTED") { setStep("cutting clip"); setStatus(`Starting… (${secs}s)`); }
    else setStatus(secs > 10 ? `Waiting for a worker… is Celery running? (${secs}s)` : "Queued…");
    await new Promise(r => setTimeout(r, 1500));
  }
}

// Boot
loadReportList().catch(() => {});
const pending = store.get(TASK_KEY);
if (pending) poll(pending);
</script>
</body>
</html>
