<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151A24"/>
      <stop offset="1" stop-color="#0F1115"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" rx="24" fill="url(#bg)"/>

  <!-- Mock player frame -->
  <rect x="160" y="110" width="960" height="420" rx="14" fill="#1E222B" stroke="#2A2F3A" stroke-width="2"/>
  <circle cx="640" cy="320" r="62" fill="#5B8CFF"/>
  <path d="M622 286v68l56-34-56-34z" fill="#FFFFFF"/>

  <!-- Detection labels -->
  <g font-size="20" font-weight="600" fill="#FFFFFF">
    <rect x="196" y="146" width="190" height="44" rx="8" fill="#0A0C10" stroke="#FF5D73" stroke-width="3"/>
    <text x="216" y="175">broken heart</text>
    <rect x="904" y="446" width="180" height="44" rx="8" fill="#0A0C10" stroke="#FFB547" stroke-width="3"/>
    <text x="924" y="475">snowflake</text>
  </g>

  <!-- Mock timeline -->
  <rect x="160" y="556" width="960" height="14" rx="4" fill="#1E222B"/>
  <rect x="250" y="556" width="70" height="14" rx="4" fill="#FF5D73"/>
  <rect x="520" y="556" width="40" height="14" rx="4" fill="#FF5D73"/>
  <rect x="700" y="556" width="110" height="14" rx="4" fill="#FFB547"/>
  <rect x="160" y="580" width="960" height="14" rx="4" fill="#1E222B"/>
  <rect x="380" y="580" width="90" height="14" rx="4" fill="#5B8CFF"/>
  <rect x="900" y="580" width="60" height="14" rx="4" fill="#5B8CFF"/>

  <text x="640" y="652" text-anchor="middle" font-size="30" font-weight="600" fill="#E6E8EE">Watch the demo on YouTube</text>
  <text x="640" y="686" text-anchor="middle" font-size="18" fill="#8A91A0">Scan a video, then watch detected icons appear on the player and the timeline</text>
</svg>
